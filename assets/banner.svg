<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" role="img" aria-label="Estanislao Torres Campi — Full Stack Developer, Especialista en Ciberseguridad, Founder &amp; CEO de TorresCampi Soft" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 18px; }
    .title { font-size: 13px; fill: #8b949e; }
    .p  { fill: #3fb950; font-weight: 700; }
    .c  { fill: #e6edf3; }
    .name { fill: #ffffff; font-weight: 700; font-size: 26px; }
    .r  { fill: #c9d1d9; }
    .a  { fill: #7c84ff; font-weight: 700; }
    .h  { opacity: 0; animation: show .35s ease-out forwards; }
    .cover { fill: #0d1117; }
    .cursor { fill: #7c84ff; opacity: 0; animation: show 0s 6.2s forwards, blink 1s 6.2s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes type6  { to { transform: translateX(80px);  } }
    @keyframes type13 { to { transform: translateX(160px); } }
    @keyframes type14 { to { transform: translateX(170px); } }
  </style>

  <!-- ventana -->
  <rect x="1" y="1" width="818" height="408" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h794a12 12 0 0 1 12 12v27H1z" fill="#161b22"/>
  <line x1="1" y1="40" x2="819" y2="40" stroke="#30363d" stroke-width="2"/>
  <circle cx="24" cy="21" r="6.5" fill="#ff5f57"/>
  <circle cx="45" cy="21" r="6.5" fill="#febc2e"/>
  <circle cx="66" cy="21" r="6.5" fill="#28c840"/>
  <text x="410" y="26" text-anchor="middle" class="title">estanislao@torrescampi: ~</text>

  <!-- $ whoami -->
  <g class="h" style="animation-delay:.3s">
    <text x="30" y="88" class="p">$</text>
    <text x="52" y="88" class="c">whoami</text>
    <rect x="50" y="70" width="90" height="26" class="cover" style="animation: type6 .6s .5s steps(6) forwards"/>
  </g>
  <text x="30" y="126" class="name h" style="animation-delay:1.3s">Estanislao Torres Campi</text>

  <!-- $ cat roles.txt -->
  <g class="h" style="animation-delay:1.8s">
    <text x="30" y="172" class="p">$</text>
    <text x="52" y="172" class="c">cat roles.txt</text>
    <rect x="50" y="154" width="170" height="26" class="cover" style="animation: type13 1s 2s steps(13) forwards"/>
  </g>
  <g class="h" style="animation-delay:3.1s"><text x="30" y="206"><tspan class="a">› </tspan><tspan class="r">Full Stack Developer · NestJS · Next.js · TypeScript</tspan></text></g>
  <g class="h" style="animation-delay:3.4s"><text x="30" y="236"><tspan class="a">› </tspan><tspan class="r">Especialista en Ciberseguridad · Pentesting</tspan></text></g>
  <g class="h" style="animation-delay:3.7s"><text x="30" y="266"><tspan class="a">› </tspan><tspan class="r">Founder &amp; CEO @ </tspan><tspan class="a">TorresCampi Soft</tspan></text></g>

  <!-- $ echo $UBICACION -->
  <g class="h" style="animation-delay:4.2s">
    <text x="30" y="312" class="p">$</text>
    <text x="52" y="312" class="c">echo $UBICACION</text>
    <rect x="50" y="294" width="190" height="26" class="cover" style="animation: type14 1.1s 4.4s steps(15) forwards"/>
  </g>
  <text x="30" y="346" class="r h" style="animation-delay:5.7s">Tucumán, Argentina</text>

  <!-- prompt final -->
  <g class="h" style="animation-delay:6.2s"><text x="30" y="386" class="p">$</text></g>
  <rect x="52" y="370" width="11" height="21" class="cursor"/>
</svg>
